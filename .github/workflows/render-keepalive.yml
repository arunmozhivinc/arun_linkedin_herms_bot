name: Render 24/7 Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier from sleeping after 15 minutes of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service Health Endpoint
        run: |
          if [ -n "${{ secrets.RENDER_APP_URL }}" ]; then
            echo "Pinging ${{ secrets.RENDER_APP_URL }}/health..."
            curl -s -f "${{ secrets.RENDER_APP_URL }}/health" || echo "Ping failed or server waking up"
          else
            echo "RENDER_APP_URL secret not set yet. Skipping keep-alive ping."
          fi

